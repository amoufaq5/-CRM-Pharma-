name: crm-pharma

# The CRM alongside the ERP, sharing one Postgres (ADR-0001 option b).
#
# WHAT THIS FILE DOES NOT DO: it does not start the CrossEngin ERP. The CRM reads
# ERP master data over SQL from the SAME database, so the ERP must be migrated
# into `db` before `migrate` runs — the CRM's 0001 checks for
# meta.operate_entity_records and refuses with a message saying so. Two ways to
# satisfy that:
#
#   1. Point this stack's `db` at the ERP's existing Postgres (set PG* in .env)
#      and drop the `db` service. This is the real deployment.
#   2. For local work, run the ERP's own compose stack first against this `db`.
#
# Everything reads deploy/.env — copy deploy/.env.example and fill it in.

x-crm-build: &crm-build
  context: ..
  dockerfile: deploy/Dockerfile
  # EXPLICIT, because the default is the LAST stage and that is now `web`. Without this,
  # migrate, api and scheduler would each be built as the caddy image and die on
  # `exec: "node": executable file not found in $PATH` — which is exactly what CI
  # answered the first time the web stage existed. The caddy service overrides it below.
  target: runtime

# The APPLICATION identity. Never the admin: crm_app owns crm.* and holds SELECT
# on one ERP table, and a table's owner bypasses RLS — so the runtime connecting
# as the admin would silently void tenant isolation.
x-crm-pg-env: &crm-pg-env
  PGHOST: ${PGHOST:-db}
  PGPORT: ${PGPORT:-5432}
  PGDATABASE: ${POSTGRES_DB}
  PGUSER: crm_app
  PGPASSWORD: ${CRM_APP_PASSWORD}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot, idempotent, gates both app services. Runs as the ADMIN because it
  # must CREATE ROLE and CREATE EXTENSION; it switches to crm_app itself for the
  # application migrations so the tables come out owned correctly.
  migrate:
    build: *crm-build
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: ${PGHOST:-db}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      CRM_APP_PASSWORD: ${CRM_APP_PASSWORD}
      MIGRATIONS_DIR: /app/db/migrations
    command: ["node", "packages/db/dist/bin/migrate.js"]
    restart: "no"

  api:
    build: *crm-build
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *crm-pg-env
      PORT: "8080"
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL}
    command: ["node", "packages/api/dist/bin/api.js"]
    expose: ["8080"]
    healthcheck:
      # /healthz queries the database AND checks that the connection's role is one
      # row-level security applies to, so this reports readiness rather than merely
      # "the process is alive". Caddy gates on it below.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  scheduler:
    build: *crm-build
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *crm-pg-env
      ERP_BASE_URL: ${ERP_BASE_URL}
      # The ONLY service that gets the signing key. The API publishes the JWKS from
      # the database and holds no private key, so it cannot mint a token even if it
      # is compromised; keep it that way.
      CRM_SIGNING_KEY_FILE: ${CRM_SIGNING_KEY_FILE:-}
      CRM_SIGNING_KEY_PEM: ${CRM_SIGNING_KEY_PEM:-}
      # Must match operate-server's --jwt-issuer and --jwt-audience exactly.
      CRM_TOKEN_ISSUER: ${CRM_TOKEN_ISSUER:-}
      ERP_TOKEN_AUDIENCE: ${ERP_TOKEN_AUDIENCE:-}
      ERP_TOKEN_TTL_SECONDS: ${ERP_TOKEN_TTL_SECONDS:-}
      # One variable per endpoint, named by its crm.notification_endpoint row's
      # secret_env. The scheduler is the only process that sends, so it is the only
      # one that needs them. This holds for BOTH channels: the webhook sender reads
      # the HMAC secret by that name, and the SMTP sender reads the relay password by
      # that name — so two tenants relaying through one host with different
      # credentials need no second process.
      CRM_HOOK_OPS_SECRET: ${CRM_HOOK_OPS_SECRET:-}
      CRM_SMTP_PASSWORD: ${CRM_SMTP_PASSWORD:-}
      # The email channels — BOTH of them, from one relay. SMTP_HOST is the switch:
      # unset means this process sends webhooks only, and an `email` or
      # `email_recipient` endpoint row retries with a readable reason rather than
      # dead-lettering. Set, and the senders are constructed AT BOOT — so a relay
      # configured without TLS, or with a From that is not a mailbox, stops the
      # process instead of being discovered one dead notification at a time.
      #
      # Two senders, one class, one relay (0065): `email` takes its mailbox from the
      # endpoint's own frozen `mailto:` url, `email_recipient` from the address
      # resolved onto each delivery out of `crm.rep_notify_address`. There is nothing
      # to configure for the second — registering it is unconditional, because the
      # alternative is a deployment that mails the ops mailbox and silently retries
      # every personally-addressed signal until it dead-letters.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # starttls (default) | implicit_tls | plaintext. plaintext is refused to anything
      # but a loopback relay: a notification carries a rep's name and an account id.
      SMTP_TRANSPORT: ${SMTP_TRANSPORT:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_CLIENT_NAME: ${SMTP_CLIENT_NAME:-}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-}
      # Development-only, and ignored when a signing key is set. The process
      # REFUSES to start with it under NODE_ENV=production.
      ERP_TOKEN: ${ERP_TOKEN:-}
      NODE_ENV: ${SCHEDULER_NODE_ENV:-production}
    volumes:
      # Mounted read-only when CRM_SIGNING_KEY_FILE points inside it. Remove the
      # mount rather than leaving an empty directory if the key comes in by env.
      - ${CRM_SECRETS_DIR:-./secrets}:/run/secrets:ro
    command: ["node", "packages/scheduler/dist/bin/scheduler.js"]
    # Exactly one is not required — claimDueJobs advances next_run_at inside the
    # claim, so N instances share the work safely. One is simply enough.
    restart: unless-stopped

  # The edge, and the app it serves. Built from the same Dockerfile as the API — its
  # `web` target is caddy:2 plus the field client's bundle, produced by the build stage
  # from the committed sources — so the files a browser downloads cannot drift from the
  # API they call.
  caddy:
    build:
      <<: *crm-build
      target: web
    depends_on:
      api:
        # HEALTHY, not merely started. The api healthcheck reports readiness, which
        # since the privilege guard landed includes "connected as a role that row-level
        # security applies to" — a wrong PGUSER makes /healthz answer 503. Under
        # `service_started` Caddy would proxy traffic to a container that answers 503 to
        # every request, which is precisely the misconfiguration the guard exists to
        # stop reaching users. deploy/README.md claimed this gate; it is now true.
        condition: service_healthy
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  caddy-config:
