name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The contract tests need a REAL Postgres. CrossEngin tests its Postgres
    # modules offline against a fake connection and its own CLAUDE.md says that
    # catches SQL *shape* only — "several real defects in this repo were found
    # only by booting a throwaway cluster". Several of ours were too, so the
    # database is part of CI rather than a thing someone remembers to run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: crm_test
      # The APPLICATION identity's password, and it is load-bearing here in a way it
      # is not locally. `appPool()` connects as crm_app — deliberately, because the
      # admin bypasses RLS and a suite run as the admin cannot catch a missing tenant
      # predicate — and 0001 creates that role with no password. Over a unix socket
      # peer auth ignores that; over TCP the postgres image's pg_hba is
      # `host all all all scram-sha-256`, and this job connects over TCP.
      #
      # So every suite needing the application identity answered `password
      # authentication failed for user "crm_app"` here: 32 of 82 files failed and
      # 1,073 tests never ran, while the same tree was 82/82 green over a socket. It
      # did not look like 1,073 missing tests either — vitest reports them as skipped
      # after the beforeAll fails, and a skipped contract test reads like a passing one
      # in a summary line. setup-test-db.sh now sets this password AND opens the
      # suite's own connection to prove it works, so forgetting this variable stops
      # the setup instead of hollowing out the run.
      PGAPPPASSWORD: crm-test-app

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Test files are excluded from `tsc` so they are not emitted into dist, and vitest
      # transpiles without checking types — so for most of this project's life not one of
      # its ~1,100 tests was typechecked. The day this gate landed it found a test whose
      # parameter had silently collapsed to `never`, meaning it had been asserting
      # nothing about the thing it was named after.
      - name: Typecheck the tests
        run: pnpm typecheck:tests

      # The ERP has no CI of its own, so a change to its served schema lands
      # unannounced. Without this gate the first we would hear of it is a filter
      # quietly returning the wrong rows in production — the ERP ignores a
      # non-filterable param silently rather than rejecting it.
      - name: ERP schema drift check
        run: pnpm erp:codegen:check

      - name: Provision roles and schema
        run: ./scripts/setup-test-db.sh

      # `pnpm test`, with its failures made READABLE. The plain step output is not: every
      # job that uses a service container ends by dumping that container's whole log, and
      # postgres:16 under this suite writes ~90 KB of expected negative-test errors, which
      # buries vitest's own output beyond the reach of the logs API. That is not a
      # cosmetic problem — it is why this job stayed red for 33 consecutive runs while
      # the cause (`crm_app` had no password, so a third of the files never ran) sat
      # unread. So on failure the failing lines are re-emitted as workflow ANNOTATIONS,
      # which are served by their own endpoint and cannot be buried.
      - name: Test
        run: |
          set +e
          pnpm test > "$RUNNER_TEMP/vitest.log" 2>&1
          code=$?
          set -e
          tail -80 "$RUNNER_TEMP/vitest.log"
          if [ "$code" -ne 0 ]; then
            sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest.log" \
              | grep -E "^ *(FAIL|×|✗)|AssertionError|^ *→ |Timeout|Test Files  |Tests  " \
              | head -40 > "$RUNNER_TEMP/failures.txt" || true
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < "$RUNNER_TEMP/failures.txt"
          fi
          exit "$code"
  # The migration RUNNER, separately, on its own fresh database.
  #
  # build-and-test applies migrations with psql (scripts/setup-test-db.sh), which
  # proves the SQL is right but says nothing about the runner that will apply it in
  # production: the role switch, the hash ledger, the two-phase split. A deploy uses
  # the runner, so the runner is what this checks.
  #
  # It needs its own database because the check starts from "the ERP exists and
  # nothing else" and asserts an EMPTY ledger, which the other job's database does
  # not have.
  migration-runner:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: crm_migrate

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner ships as compiled output; `pnpm db:migrate` builds it, but the
      # verify script invokes dist directly so the build has to happen first.
      - name: Build
        run: pnpm build

      # Asserts: every crm table owned by crm_app, the schema invariants hold on a
      # runner-built database, a second run is a no-op, and an edited
      # already-applied migration is refused.
      - name: Verify the migration runner
        run: ./scripts/verify-migration-runner.sh

  # The deployment stack, in three layers of increasing cost.
  #
  # This job used to say the stack "has never been built or run — no Docker daemon has
  # been available". The second half was never checked: `dockerd` starts fine in the
  # development container, and the day someone tried it, the image turned out not to
  # build at all. Four independent reasons, each fatal, each sitting there for six weeks
  # while this job passed — because every check was a check on the TEXT of the files.
  #
  #   1. docker compose config, plus ten static properties (identities, ordering, tags,
  #      root, the signing key, and now the manifest list, the context, and the build);
  #   2. the image's build replayed without Docker, which is what a developer runs;
  #   3. a real build and a real stack: Postgres, migrate, the api, the scheduler, the
  #      TLS edge. GitHub's runners have a daemon, so there is no excuse for stopping at
  #      the first two.
  deploy-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Static properties of the stack
        run: ./scripts/verify-deploy-stack.sh

      # Replays both stages of the Dockerfile outside Docker, against a context built
      # from tracked files only, and then RUNS the entrypoints out of the runtime stage's
      # file set. Fast, and it catches everything the four defects were.
      - name: Replay the image build
        run: ./scripts/verify-image-build.sh

      # The real thing. Builds the image and brings the stack up against a real Postgres:
      # the 0001 ERP precondition refusing, all 54 migrations applying, a second run as a
      # no-op, the api healthy as crm_app, the JWKS fail-closed rule, 401 problem
      # documents, the scheduler refusing without a credential and running with one, and
      # the api publishing exactly the key the scheduler signs with.
      #
      # No CRM_SMOKE_CA_FILE and no CRM_SMOKE_PIN_BASE here: a runner has no TLS
      # interception and no anonymous-pull limit to dodge, so this builds deploy/Dockerfile
      # byte for byte.
      - name: Build and run the stack
        run: ./scripts/verify-deploy-smoke.sh
