name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The contract tests need a REAL Postgres. CrossEngin tests its Postgres
    # modules offline against a fake connection and its own CLAUDE.md says that
    # catches SQL *shape* only — "several real defects in this repo were found
    # only by booting a throwaway cluster". Several of ours were too, so the
    # database is part of CI rather than a thing someone remembers to run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: crm_test
      # The APPLICATION identity's password, and it is load-bearing here in a way it
      # is not locally. `appPool()` connects as crm_app — deliberately, because the
      # admin bypasses RLS and a suite run as the admin cannot catch a missing tenant
      # predicate — and 0001 creates that role with no password. Over a unix socket
      # peer auth ignores that; over TCP the postgres image's pg_hba is
      # `host all all all scram-sha-256`, and this job connects over TCP.
      #
      # So every suite needing the application identity answered `password
      # authentication failed for user "crm_app"` here: 32 of 82 files failed and
      # 1,073 tests never ran, while the same tree was 82/82 green over a socket. It
      # did not look like 1,073 missing tests either — vitest reports them as skipped
      # after the beforeAll fails, and a skipped contract test reads like a passing one
      # in a summary line. setup-test-db.sh now sets this password AND opens the
      # suite's own connection to prove it works, so forgetting this variable stops
      # the setup instead of hollowing out the run.
      PGAPPPASSWORD: crm-test-app

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `typecheck:packages` and not `typecheck`, which since this commit runs both halves:
      # the two stay separate STEPS here so a failure says which half failed, where one
      # command is what a developer should be able to type without having to remember the
      # second. The day that convenience did not exist, a test with a type error in it
      # reached CI from a working tree where `pnpm typecheck` was green.
      - name: Typecheck
        run: pnpm typecheck:packages

      # Test files are excluded from `tsc` so they are not emitted into dist, and vitest
      # transpiles without checking types — so for most of this project's life not one of
      # its ~1,100 tests was typechecked. The day this gate landed it found a test whose
      # parameter had silently collapsed to `never`, meaning it had been asserting
      # nothing about the thing it was named after.
      - name: Typecheck the tests
        run: pnpm typecheck:tests

      # The ERP has no CI of its own, so a change to its served schema lands
      # unannounced. Without this gate the first we would hear of it is a filter
      # quietly returning the wrong rows in production — the ERP ignores a
      # non-filterable param silently rather than rejecting it.
      - name: ERP schema drift check
        run: pnpm erp:codegen:check

      - name: Provision roles and schema
        run: ./scripts/setup-test-db.sh

      # `pnpm test`, with its failures made READABLE. The plain step output is not: every
      # job that uses a service container ends by dumping that container's whole log, and
      # postgres:16 under this suite writes ~90 KB of expected negative-test errors, which
      # buries vitest's own output beyond the reach of the logs API. That is not a
      # cosmetic problem — it is why this job stayed red for 33 consecutive runs while
      # the cause (`crm_app` had no password, so a third of the files never ran) sat
      # unread. So on failure the failing lines are re-emitted as workflow ANNOTATIONS,
      # which are served by their own endpoint and cannot be buried.
      - name: Test
        run: |
          set +e
          pnpm test > "$RUNNER_TEMP/vitest.log" 2>&1
          code=$?
          set -e
          tail -80 "$RUNNER_TEMP/vitest.log"
          if [ "$code" -ne 0 ]; then
            sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/vitest.log" \
              | grep -E "^ *(FAIL|×|✗)|AssertionError|^ *→ |Timeout|Test Files  |Tests  " \
              | head -40 > "$RUNNER_TEMP/failures.txt" || true
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < "$RUNNER_TEMP/failures.txt"
          fi
          exit "$code"
  # The migration RUNNER, separately, on its own fresh database.
  #
  # build-and-test applies migrations with psql (scripts/setup-test-db.sh), which
  # proves the SQL is right but says nothing about the runner that will apply it in
  # production: the role switch, the hash ledger, the two-phase split. A deploy uses
  # the runner, so the runner is what this checks.
  #
  # It needs its own database because the check starts from "the ERP exists and
  # nothing else" and asserts an EMPTY ledger, which the other job's database does
  # not have.
  migration-runner:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_migrate
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: crm_migrate

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The runner ships as compiled output; `pnpm db:migrate` builds it, but the
      # verify script invokes dist directly so the build has to happen first.
      - name: Build
        run: pnpm build

      # Asserts: every crm table owned by crm_app, the schema invariants hold on a
      # runner-built database, a second run is a no-op, and an edited
      # already-applied migration is refused.
      # ANNOTATED ON FAILURE, like every other gate in this workflow since the field-client job
      # went red twice with nothing recoverable but a red square. A job's log is served from a
      # blob host the API cannot reach; annotations have their own endpoint.
      - name: Verify the migration runner
        shell: bash
        run: |
          set +e
          ./scripts/verify-migration-runner.sh > "$RUNNER_TEMP/migrate.log" 2>&1
          code=$?
          set -e
          tail -60 "$RUNNER_TEMP/migrate.log"
          if [ "$code" -ne 0 ]; then
            # Both the matching lines and the tail: a migration that fails says so loudly, and a script that dies unchecked says nothing at all.
            sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/migrate.log" \
              | grep -E "^(FAIL|fail:)|AssertionError|ERROR|error:|Timeout|refused|exited [0-9]+" \
              | head -30 > "$RUNNER_TEMP/migrate-failures.txt" || true
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < "$RUNNER_TEMP/migrate-failures.txt"
            printf '::error::--- the last 20 lines before it stopped ---\n'
            sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/migrate.log" | tail -20 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          fi
          exit "$code"

  # The field client, driven in a real browser against the real API binary.
  #
  # ADR-0001's open table carried THERE IS NO CLIENT longer than any other row, and
  # everything the CRM built for a device — ids minted before the network exists, per-row
  # sync outcomes, upsert-by-device-id so a replay cannot duplicate — was a guess about a
  # consumer that did not exist. This job is what stops it being a guess, and it is its
  # own job because it needs a browser and a database and takes longer than the unit
  # tests it complements.
  #
  # The browser is driven over the DevTools Protocol with no test framework: Node 22 ships
  # a WebSocket client, the harness needs five verbs, and `Network.emulateNetworkConditions`
  # is the one capability that matters — an offline-first client that has never been
  # offline is a guess too.
  field-client:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_client
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGAPPPASSWORD: crm-test-app
      # The harness creates its own throwaway database; this one just has to exist for
      # the admin connection that creates it.
      PGDATABASE: crm_client

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A runner has Chrome; the harness finds it, or fails saying so rather than
      # skipping. A browser check that skips when there is no browser is not a check.
      #
      # AND IT RE-EMITS ITS FAILURES AS ANNOTATIONS, which `build-and-test` has done since
      # the deploy gate "printed its verdict and no evidence" and stayed red for 33 runs. The
      # reason it has to: a job's log is served from a blob host that the API cannot reach, so
      # a failure here was a red square with no readable cause — and this job went red once on
      # a commit that was green locally and the only way to find out why was to guess. An
      # annotation is the one channel the API does serve.
      - name: Drive the field client in a real browser
        shell: bash
        run: |
          set +e
          ./scripts/verify-client-live.sh > "$RUNNER_TEMP/client.log" 2>&1
          code=$?
          set -e
          tail -120 "$RUNNER_TEMP/client.log"
          if [ "$code" -ne 0 ]; then
            # TWO CAPTURES, and the second one is why. The grep finds the lines that LOOK like a
            # cause; the tail reports where the script actually stopped, which is the only thing
            # that helps when it stopped without saying anything — an unchecked command under
            # `set -e` exits silently, and this job went red exactly that way. The first attempt
            # at this step had the grep alone and the annotations showed five harmless
            # "command not found" lines and no cause.
            sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/client.log" \
              | grep -E "^(FAIL|fail:)|^ *(×|✗)|AssertionError|^ *→ |Timeout|uncaught|checks, [0-9]+ failure" \
              | head -30 > "$RUNNER_TEMP/client-failures.txt" || true
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < "$RUNNER_TEMP/client-failures.txt"
            printf '::error::--- the last 20 lines before it stopped ---\n'
            sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/client.log" | tail -20 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          fi
          exit "$code"

  # The deployment stack, in three layers of increasing cost.
  #
  # This job used to say the stack "has never been built or run — no Docker daemon has
  # been available". The second half was never checked: `dockerd` starts fine in the
  # development container, and the day someone tried it, the image turned out not to
  # build at all. Four independent reasons, each fatal, each sitting there for six weeks
  # while this job passed — because every check was a check on the TEXT of the files.
  #
  #   1. docker compose config, plus ten static properties (identities, ordering, tags,
  #      root, the signing key, and now the manifest list, the context, and the build);
  #   2. the image's build replayed without Docker, which is what a developer runs;
  #   3. a real build and a real stack: Postgres, migrate, the api, the scheduler, the
  #      TLS edge. GitHub's runners have a daemon, so there is no excuse for stopping at
  #      the first two.
  deploy-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Static properties of the stack
        run: ./scripts/verify-deploy-stack.sh

      # Replays both stages of the Dockerfile outside Docker, against a context built
      # from tracked files only, and then RUNS the entrypoints out of the runtime stage's
      # file set. Fast, and it catches everything the four defects were.
      - name: Replay the image build
        run: ./scripts/verify-image-build.sh

      # The real thing. Builds the image and brings the stack up against a real Postgres:
      # the 0001 ERP precondition refusing, all 57 migrations applying, a second run as a
      # no-op, the api healthy as crm_app, the JWKS fail-closed rule, 401 problem
      # documents, the scheduler refusing without a credential and running with one, and
      # the api publishing exactly the key the scheduler signs with.
      #
      # No CRM_SMOKE_CA_FILE and no CRM_SMOKE_PIN_BASE here: a runner has no TLS
      # interception and no anonymous-pull limit to dodge, so this builds deploy/Dockerfile
      # byte for byte.
      # ANNOTATED ON FAILURE, and this job is the reason ADR-0001 carries a row saying a
      # recurrence "will now carry its evidence": the smoke gate went red once at the
      # scheduler's key check, on a commit whose whole diff was a comment and three documents,
      # and the gate printed its verdict and no evidence. Its failure path prints plenty now —
      # which was worth nothing in CI, where the log is served from a host the API cannot reach.
      # This is the other half of that promise.
      - name: Build and run the stack
        shell: bash
        run: |
          set +e
          ./scripts/verify-deploy-smoke.sh > "$RUNNER_TEMP/smoke.log" 2>&1
          code=$?
          set -e
          tail -60 "$RUNNER_TEMP/smoke.log"
          if [ "$code" -ne 0 ]; then
            # The kid, the credential lines and the container logs the gate prints on failure are in the tail; the grep catches the verdict line itself.
            sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/smoke.log" \
              | grep -E "^(FAIL|fail:)|AssertionError|ERROR|error:|Timeout|refused|exited [0-9]+" \
              | head -30 > "$RUNNER_TEMP/smoke-failures.txt" || true
            while IFS= read -r line; do printf '::error::%s\n' "$line"; done < "$RUNNER_TEMP/smoke-failures.txt"
            printf '::error::--- the last 20 lines before it stopped ---\n'
            sed -E 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/smoke.log" | tail -20 \
              | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
          fi
          exit "$code"
